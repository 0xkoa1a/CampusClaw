<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>班级观测面板 · CampusClaw</title>
  <style>
    :root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#182432;background:#f3f6f8}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:28px 20px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:24px;margin:0}select,button{padding:9px 12px;border:1px solid #cbd5dc;border-radius:8px;background:white;color:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px;margin-top:20px}.card{background:#fff;border:1px solid #e0e6e9;border-radius:14px;padding:18px;min-width:0}.card h2{font-size:16px;margin:0 0 14px}.chart{width:100%;height:230px;overflow:visible}.axis{stroke:#dce3e7;stroke-width:1}.line{fill:none;stroke-width:3}.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}.empty{padding:34px 12px;text-align:center;color:#65737d;background:#f7f9fa;border-radius:10px}.metric{font-size:28px;font-weight:650}.subtle{font-size:13px;color:#64727c}.alerts{display:grid;gap:10px}.alert{padding:12px;border-radius:9px;background:#fff7e8;border-left:4px solid #da8b18}.alert.resolved{background:#f2f5f6;border-color:#9aa7af}.error{color:#a52f2f;padding:12px}.notice{margin-top:20px}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:520px){.wrap{padding:18px 12px}header{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body><main class="wrap">
  <header><div><h1>班级观测面板</h1><div id="updated" class="subtle">正在加载…</div></div>
    <label>统计时间窗 <select id="window"><option value="300">最近 5 分钟</option><option value="3600" selected>最近 1 小时</option><option value="21600">最近 6 小时</option><option value="86400">最近 24 小时</option><option value="604800">最近 7 天</option></select></label></header>
  <p id="message" role="status" class="visually-hidden"></p><div id="error" class="error" hidden></div>
  <section class="grid" aria-label="观测图表">
    <article class="card"><h2>技能调用量</h2><div id="calls-empty" class="empty" hidden>当前时间窗没有技能调用记录。</div><svg id="calls" class="chart" role="img" aria-label="三个技能的调用量趋势" viewBox="0 0 600 220"></svg><div id="calls-legend" class="legend"></div></article>
    <article class="card"><h2>各技能错误率</h2><div id="rate-empty" class="empty" hidden>当前时间窗没有技能调用记录。</div><svg id="rates" class="chart" role="img" aria-label="各技能错误率" viewBox="0 0 600 220"></svg><div id="rates-legend" class="legend"></div></article>
    <article class="card"><h2>HTTP P95 与批改队列</h2><div id="queue-empty" class="empty" hidden>当前时间窗没有接口耗时和排队任务数据。</div><svg id="queue" class="chart" role="img" aria-label="接口 P95 耗时和待处理及运行中任务数" viewBox="0 0 600 220"></svg><div id="queue-caption" class="subtle"></div></article>
  </section>
  <section class="card notice"><h2>站内告警通知记录</h2><div id="alerts" class="alerts"><div class="empty">正在读取通知记录…</div></div></section>
</main>
<script>
(() => {
  const colors=['#2368a2','#d77a19','#27866d'];
  const el=id=>document.getElementById(id);
  const svgNode=(tag,attrs={})=>{const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,String(v));return n;};
  function axes(svg,max){svg.replaceChildren();for(let i=0;i<5;i++){const y=190-i*42;svg.append(svgNode('line',{x1:42,y1:y,x2:584,y2:y,class:'axis'}));const t=svgNode('text',{x:4,y:y+4,fill:'#64727c','font-size':11});t.textContent=String(Math.round(max*i/4));svg.append(t);}}
  function renderLines(svgId,legendId,emptyId,series,mode){const svg=el(svgId),legend=el(legendId);legend.replaceChildren();el(emptyId).hidden=series.length>0;svg.hidden=series.length===0;if(!series.length)return;
    const max=mode==='rate'?1:Math.max(1,...series.flatMap(s=>s.values));axes(svg,max);
    series.forEach((s,index)=>{const vals=s.values,points=vals.map((v,i)=>`${42+(vals.length<2?0:i*542/(vals.length-1))},${190-(v/max)*168}`).join(' ');svg.append(svgNode('polyline',{points,class:'line',stroke:colors[index%colors.length]}));const item=document.createElement('span'),dot=document.createElement('i');dot.style.background=colors[index%colors.length];item.append(dot,document.createTextNode(s.skill));legend.append(item);});}
  function renderRates(items){renderLines('rates','rates-legend','rate-empty',items.map(x=>({skill:x.skill,values:[x.rate??0]})), 'rate');const svg=el('rates');if(items.length){svg.replaceChildren();axes(svg,1);items.forEach((x,i)=>{const y=45+i*48,bar=svgNode('rect',{x:145,y,width:Math.max(1,Math.min(430,(x.rate||0)*430)),height:24,rx:5,fill:colors[i%colors.length]});svg.append(bar);const name=svgNode('text',{x:42,y:y+17,fill:'#34434d','font-size':12});name.textContent=x.skill;svg.append(name);const value=svgNode('text',{x:Math.min(580,150+Math.min(430,(x.rate||0)*430)),y:y+17,fill:'#34434d','font-size':12});value.textContent=`${(100*(x.rate||0)).toFixed(2)}%（${x.errors}/${x.calls}）`;svg.append(value);});}}
  function renderQueue(data){const svg=el('queue');const queue=data.queue;const any=data.http_sample_count>0||queue.pending>0||queue.running>0;el('queue-empty').hidden=any;svg.hidden=!any;if(!any)return;svg.replaceChildren();const entries=[{name:'HTTP P95 (ms)',value:data.http_p95_ms||0,color:'#2368a2'},{name:'待处理',value:queue.pending,color:'#d77a19'},{name:'运行中',value:queue.running,color:'#27866d'}],max=Math.max(1,...entries.map(x=>x.value));entries.forEach((x,i)=>{const y=38+i*55,w=450*x.value/max;const label=svgNode('text',{x:6,y:y+18,fill:'#34434d','font-size':12});label.textContent=x.name;svg.append(label,svgNode('rect',{x:125,y,width:w,height:28,rx:5,fill:x.color}));const val=svgNode('text',{x:Math.min(580,132+w),y:y+19,fill:'#34434d','font-size':12});val.textContent=String(x.value);svg.append(val);});el('queue-caption').textContent=`HTTP 样本 ${data.http_sample_count} 条 · pending + running 来自本班 SQLite 批改任务`;}
  function renderAlerts(items,policy){const list=el('alerts');list.replaceChildren();if(!items.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='当前没有告警通知记录。';list.append(empty);return;}items.forEach(a=>{const box=document.createElement('div');box.className=`alert ${a.status==='resolved'?'resolved':''}`;const state=a.status==='active'?'告警中':a.status==='pending'?'持续观测中':'已恢复';const title=document.createElement('strong');title.textContent=`${state}：${a.skill} 错误率 ${(100*a.error_rate).toFixed(2)}%`;const body=document.createElement('div');body.textContent=`阈值 ${(100*a.threshold).toFixed(2)}%，持续条件 ${policy.window_seconds} 秒 · ${a.start_at} 至 ${a.end_at||'观测中'}`;const note=document.createElement('div');note.className='subtle';note.textContent=a.status==='pending'?'站内告警候选记录，尚未满足持续条件':'站内通知记录';box.append(title,body,note);list.append(box);});}
  async function load(){el('error').hidden=true;try{const response=await fetch(`/api/monitoring?window=${encodeURIComponent(el('window').value)}`,{headers:{Accept:'application/json'}});const data=await response.json();if(!response.ok)throw new Error(data.error||`请求失败（${response.status}）`);const callSeries=data.invocations.series;renderLines('calls','calls-legend','calls-empty',callSeries,'count');renderRates(data.error_rates);renderQueue(data);renderAlerts(data.alerts,data.alert_policy);el('updated').textContent=`统计区间：${new Date(data.from).toLocaleString()} — ${new Date(data.to).toLocaleString()}`;el('message').textContent='观测数据已更新';}catch(e){el('error').hidden=false;el('error').textContent=`面板加载失败：${e.message}。请检查登录状态后重试。`;el('message').textContent='面板加载失败';}}
  el('window').addEventListener('change',load);load();
})();
</script></body></html>
