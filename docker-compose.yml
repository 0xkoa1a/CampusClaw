services:
  app:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment: &classroom-environment
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      SEED_TEACHER_PASSWORD: ${SEED_TEACHER_PASSWORD:?Set teacher password in .env}
      SEED_STUDENT_A_PASSWORD: ${SEED_STUDENT_A_PASSWORD:?Set A student password in .env}
      SEED_STUDENT_B_PASSWORD: ${SEED_STUDENT_B_PASSWORD:?Set B student password in .env}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-1048576}
      DATABASE_PATH: /app/data/campusclaw.sqlite3
      UPLOAD_DIR: /app/uploads
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-course-embedding}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-2048}
      CHAT_MODEL: ${CHAT_MODEL:-course-chat}
      QDRANT_URL: http://qdrant:6333
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN in .env}
      MCP_MAX_ROUNDS: ${MCP_MAX_ROUNDS:-2}
      MCP_MAX_CALLS: ${MCP_MAX_CALLS:-4}
      MCP_TOOL_TEXT_MAX_CHARS: ${MCP_TOOL_TEXT_MAX_CHARS:-4000}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-campusclaw}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      TASK_MAX_ATTEMPTS: ${TASK_MAX_ATTEMPTS:-3}
      TASK_LEASE_SECONDS: ${TASK_LEASE_SECONDS:-120}
      TASK_RETRY_BASE_SECONDS: ${TASK_RETRY_BASE_SECONDS:-1}
      MCP_ALLOWED_BASE_URLS: ${MCP_ALLOWED_BASE_URLS:-http://mcp-demo:8090}
    volumes: &classroom-volumes
      - campusclaw_data:/app/data
      - campusclaw_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - qdrant
      - mcp-demo

  worker:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    command: ["python", "-m", "app.worker"]
    environment: *classroom-environment
    volumes: *classroom-volumes
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      app:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4-alpine}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-campusclaw}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    volumes:
      - campusclaw_queue:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mcp-demo:
    build:
      context: ./mcp-server
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: ${QDRANT_IMAGE:-ghcr.io/qdrant/qdrant/qdrant:v1.19.1}
    volumes:
      - campusclaw_vectors:/qdrant/storage

volumes:
  campusclaw_data:
  campusclaw_uploads:
  campusclaw_vectors:
  campusclaw_queue:
