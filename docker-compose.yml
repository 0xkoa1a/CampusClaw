services:
  app:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      SEED_TEACHER_PASSWORD: ${SEED_TEACHER_PASSWORD:?Set teacher password in .env}
      SEED_STUDENT_A_PASSWORD: ${SEED_STUDENT_A_PASSWORD:?Set A student password in .env}
      SEED_STUDENT_B_PASSWORD: ${SEED_STUDENT_B_PASSWORD:?Set B student password in .env}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-1048576}
      DATABASE_PATH: /app/data/campusclaw.sqlite3
      UPLOAD_DIR: /app/uploads
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-course-embedding}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-2048}
      CHAT_MODEL: ${CHAT_MODEL:-course-chat}
      QDRANT_URL: http://qdrant:6333
    volumes:
      - campusclaw_data:/app/data
      - campusclaw_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - qdrant

  qdrant:
    image: ${QDRANT_IMAGE:-ghcr.io/qdrant/qdrant/qdrant:v1.19.1}
    volumes:
      - campusclaw_vectors:/qdrant/storage

volumes:
  campusclaw_data:
  campusclaw_uploads:
  campusclaw_vectors:
